  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <use href="#blossom" transform="translate(1040,96) scale(1.9) rotate(18)" opacity="0.9"/>
  <use href="#blossom" transform="translate(900,210) scale(1.1) rotate(-34)" opacity="0.7"/>
  <use href="#blossom" transform="translate(1120,300) scale(1.4) rotate(52)" opacity="0.8"/>
  <use href="#blossom" transform="translate(760,80) scale(0.8) rotate(8)" opacity="0.55"/>
  <use href="#blossom" transform="translate(1010,470) scale(0.9) rotate(-12)" opacity="0.5"/>

  <g transform="translate(84,90) scale(1.5)" fill="#15613a">
    <line x1="40" y1="92" x2="40" y2="33" stroke="#15613a" stroke-width="7" stroke-linecap="round"/>
    <path d="M40 58 C40 45 58 45 70 40" fill="none" stroke="#15613a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="58" r="4.5"/>
    <circle cx="72" cy="40" r="7.5"/>
