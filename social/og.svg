  <text x="86" y="372" font-family="Iowan Old Style, Georgia, serif" font-size="112" fill="#1c1c1e" letter-spacing="-3">One image.</text>
  <text x="86" y="470" font-family="Iowan Old Style, Georgia, serif" font-size="78" fill="#1c1c1e" letter-spacing="-1.5">Your Mac <tspan font-style="italic" fill="#15613a">and</tspan> your CI.</text>

  <text x="88" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5a574f">Graft bakes one golden macOS VM image for your dev box and your CI runners. Open source.</text>
